<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050607">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Bedside Dashboard</title>
<style>
:root{--bg:#050607;--panel:rgba(24,27,33,.78);--panel2:rgba(31,35,43,.72);--text:#f5f5f7;--muted:#979ca6;--line:rgba(255,255,255,.09);--button:rgba(255,255,255,.075);--buttonHover:rgba(255,255,255,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}body{overflow:hidden;transition:filter .25s;background:radial-gradient(circle at 76% 0%,#151923 0,transparent 34%),linear-gradient(180deg,#090b0f,#050607 58%)}body.night{filter:brightness(.62)}button,input{font:inherit}.app{width:100vw;height:100vh;padding:26px 32px 22px;display:grid;grid-template-columns:minmax(0,1.52fr) minmax(340px,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:20px}.top{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;padding:0 2px}.time{font-size:clamp(82px,8.2vw,116px);line-height:.88;font-weight:720;letter-spacing:-6px;font-variant-numeric:tabular-nums}.date{margin-top:13px;color:var(--muted);font-size:20px;font-weight:550}.rt{display:flex;gap:14px;align-items:center}.weather{text-align:right}.temp{font-size:50px;line-height:1;font-weight:680;letter-spacing:-2px}.desc{color:var(--muted);font-size:17px;margin-top:8px}.ib,.sb{border:1px solid var(--line);background:var(--button);color:var(--text);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.ib{width:52px;height:52px;border-radius:17px;font-size:22px}.sb{padding:9px 13px;border-radius:13px;font-size:14px}.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:28px;padding:24px;overflow:auto;min-height:0;box-shadow:0 22px 60px rgba(0,0,0,.24);backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%)}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h2{margin:0;font-size:25px;letter-spacing:-.5px}.day{padding-top:6px}.day+.day{margin-top:12px;padding-top:18px;border-top:1px solid var(--line)}.dayTitle{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.02em}.event,.task{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.event:last-child,.task:last-child{border-bottom:0}.et{width:72px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px;padding-top:2px}.title,.taskText{font-size:19px;line-height:1.35}.meta{font-size:13px;color:var(--muted);margin-top:5px}.task{justify-content:space-between}.taskLeft{display:flex;gap:12px;align-items:flex-start}.task input{width:22px;height:22px;margin-top:2px;accent-color:#fff}.done .taskText{text-decoration:line-through;color:var(--muted)}.del{border:0;background:transparent;color:var(--muted);font-size:20px;padding:0 4px}.bottom{grid-column:1/3;display:grid;grid-template-columns:repeat(4,minmax(118px,155px));justify-content:center;gap:10px}.quick{appearance:none;border:1px solid var(--line);color:var(--text);background:var(--button);border-radius:16px;padding:11px 15px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:650;font-size:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.quick:active{transform:scale(.98);background:var(--buttonHover)}.appGlyph{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:12px;font-weight:750}.empty,.notice{color:var(--muted);font-size:14px}.empty{padding:11px 0}.notice{margin-top:12px;line-height:1.5}dialog{border:1px solid var(--line);border-radius:22px;background:#171b22;color:var(--text);width:min(620px,90vw);padding:22px;box-shadow:0 30px 90px #0008}dialog::backdrop{background:#0009;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field input{border:1px solid var(--line);background:#0d1015;color:var(--text);border-radius:13px;padding:13px;font-size:16px}.help{font-size:13px;color:var(--muted);line-height:1.55}.row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.danger{color:#ffb4b4}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr auto;overflow:auto;padding:22px}.top,.bottom{grid-column:1}.time{font-size:68px}.bottom{grid-template-columns:repeat(2,minmax(120px,1fr))}body{overflow:auto}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div><div class="time" id="time">--:--</div><div class="date" id="date">--</div></div>
  <div class="rt"><div class="weather"><div class="temp" id="temp">--°</div><div class="desc" id="weatherDesc">載入天氣中…</div></div><button class="ib" id="nightBtn" aria-label="夜間模式">☾</button></div>
</header>
<section class="card">
  <div class="head"><h2>行程</h2><button class="sb" id="calendarBtn">Calendar 設定</button></div>
  <div class="day"><div class="dayTitle" id="todayLabel">今天</div><div id="eventsToday"></div></div>
  <div class="day"><div class="dayTitle" id="tomorrowLabel">明天</div><div id="eventsTomorrow"></div></div>
  <div class="notice" id="calendarStatus">Calendar 尚未設定。</div>
</section>
<section class="card">
  <div class="head"><h2>今日待辦</h2><button class="sb" id="addTaskBtn">＋ 新增</button></div>
  <div id="tasks"></div>
</section>
<nav class="bottom" aria-label="快速開啟 App">
  <button class="quick" data-scheme="com.openai.chat://"><span class="appGlyph">G</span><span>ChatGPT</span></button>
  <button class="quick" data-scheme="youtube://"><span class="appGlyph">▶</span><span>YouTube</span></button>
  <button class="quick" data-scheme="shortcuts://run-shortcut?name=%E9%96%8B%E5%95%9F%20YouTube%20Music"><span class="appGlyph">♪</span><span>YouTube Music</span></button>
  <button class="quick" data-scheme="googlecalendar://"><span class="appGlyph">31</span><span>Calendar</span></button>
</nav>
</div>
<dialog id="taskDialog"><h2>新增待辦</h2><div class="field"><label>內容</label><input id="taskInput" placeholder="例如：完成今天的計組進度"></div><div class="row"><button class="sb" id="cancelTask">取消</button><button class="sb" id="saveTask">新增</button></div></dialog>
<dialog id="calendarDialog"><h2>Calendar 自動同步設定</h2><p class="help">設定一次後，Dashboard 會自動讀取你在 Google Calendar 中目前選取的行事曆，並顯示今天與明天。</p><div class="field"><label>Apps Script Web App URL</label><input id="backendUrlInput" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="field"><label>Dashboard Key</label><input id="backendKeyInput" type="password" placeholder="貼上你設定的 DASHBOARD_KEY"></div><p class="help">URL 與 Key 只儲存在這台 iPad 的瀏覽器，不會寫入公開 GitHub。</p><div class="row"><button class="sb danger" id="clearCalendar">清除設定</button><button class="sb" id="cancelCalendar">取消</button><button class="sb" id="saveCalendar">儲存並測試</button></div></dialog>
<script>
const $=x=>document.getElementById(x);
let tasks=JSON.parse(localStorage.getItem('bedside_tasks')||'null')||[{text:'完成今天的考研進度',done:false},{text:'整理家教教材',done:false},{text:'確認明天行程',done:false}];
let todayEvents=[],tomorrowEvents=[],calendarTimer=null;
const taskDialog=$('taskDialog'),calendarDialog=$('calendarDialog'),taskInput=$('taskInput');
function saveTasks(){localStorage.setItem('bedside_tasks',JSON.stringify(tasks))}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderTasks(){$('tasks').innerHTML=tasks.length?tasks.map((t,i)=>`<div class="task ${t.done?'done':''}"><label class="taskLeft"><input type="checkbox" data-i="${i}" ${t.done?'checked':''}><span class="taskText">${esc(t.text)}</span></label><button class="del" data-d="${i}">×</button></div>`).join(''):'<div class="empty">今天沒有待辦</div>';document.querySelectorAll('[data-i]').forEach(x=>x.onchange=()=>{tasks[+x.dataset.i].done=x.checked;saveTasks();renderTasks()});document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{tasks.splice(+x.dataset.d,1);saveTasks();renderTasks()})}
function eventHtml(list,emptyText){return list.length?list.map(e=>`<div class="event"><div class="et">${esc(e.time)}</div><div><div class="title">${esc(e.title)}</div>${e.meta?`<div class="meta">${esc(e.meta)}</div>`:''}</div></div>`).join(''):`<div class="empty">${emptyText}</div>`}
function renderEvents(){$('eventsToday').innerHTML=eventHtml(todayEvents,'今天沒有行程');$('eventsTomorrow').innerHTML=eventHtml(tomorrowEvents,'明天沒有行程')}
function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return dayKey(new Date())}
function loadCachedEvents(){try{const c=JSON.parse(localStorage.getItem('calendar_events_cache')||'null');if(c&&c.date===todayKey()){todayEvents=Array.isArray(c.todayEvents)?c.todayEvents:(Array.isArray(c.events)?c.events:[]);tomorrowEvents=Array.isArray(c.tomorrowEvents)?c.tomorrowEvents:[];renderEvents();$('calendarStatus').textContent='顯示上次同步資料 · '+(c.syncedAt||'')}}catch{}}
function cacheEvents(){localStorage.setItem('calendar_events_cache',JSON.stringify({date:todayKey(),todayEvents,tomorrowEvents,syncedAt:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})}))}
function tick(){const d=new Date(),tm=new Date(d);tm.setDate(d.getDate()+1);$('time').textContent=d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});$('date').textContent=d.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});$('todayLabel').textContent='今天 · '+d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'});$('tomorrowLabel').textContent='明天 · '+tm.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'});if(localStorage.getItem('manualNight')===null){const h=d.getHours();document.body.classList.toggle('night',h>=23||h<7)}}
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=25.033&longitude=121.5654&current=temperature_2m,weather_code&timezone=Asia%2FTaipei',{cache:'no-store'}),j=await r.json(),c=j.current.weather_code,ds=c===0?'晴朗':c<=3?'多雲':c<=48?'有霧':c<=67?'有雨':c<=77?'降雪':c<=82?'陣雨':'雷雨';$('temp').textContent=Math.round(j.current.temperature_2m)+'°';$('weatherDesc').textContent='台北 · '+ds}catch{$('weatherDesc').textContent='天氣讀取失敗'}}
async function loadCalendar(){const base=localStorage.getItem('calendar_backend_url'),key=localStorage.getItem('calendar_backend_key');if(!base||!key){$('calendarStatus').textContent='尚未設定自動同步後端。';return}clearTimeout(calendarTimer);$('calendarStatus').textContent='正在自動同步 Calendar…';try{const url=base+(base.includes('?')?'&':'?')+new URLSearchParams({action:'today',key,_:Date.now()}).toString();const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);const r=await fetch(url,{cache:'no-store',signal:controller.signal,redirect:'follow'});clearTimeout(timeout);if(!r.ok)throw new Error('HTTP '+r.status);const text=(await r.text()).trim();let data;try{data=JSON.parse(text)}catch{const m=text.match(/^[A-Za-z_$][0-9A-Za-z_$]*\((.*)\);?$/s);if(!m)throw new Error('回傳格式錯誤');data=JSON.parse(m[1])}if(!data||data.ok!==true)throw new Error(data&&data.error?data.error:'未知錯誤');todayEvents=Array.isArray(data.todayEvents)?data.todayEvents:(Array.isArray(data.events)?data.events:[]);tomorrowEvents=Array.isArray(data.tomorrowEvents)?data.tomorrowEvents:[];renderEvents();cacheEvents();$('calendarStatus').textContent='已自動同步 Calendar · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})}catch(err){$('calendarStatus').textContent='Calendar 同步失敗：'+(err&&err.message?err.message:'無法連線')+'，先顯示快取資料。'}calendarTimer=setTimeout(loadCalendar,5*60*1000)}
function launchApp(scheme){window.location.href=scheme}
$('addTaskBtn').onclick=()=>{taskInput.value='';taskDialog.showModal();setTimeout(()=>taskInput.focus(),100)};
$('cancelTask').onclick=()=>taskDialog.close();
$('saveTask').onclick=()=>{const t=taskInput.value.trim();if(t){tasks.push({text:t,done:false});saveTasks();renderTasks();taskDialog.close()}};
$('calendarBtn').onclick=()=>{$('backendUrlInput').value=localStorage.getItem('calendar_backend_url')||'';$('backendKeyInput').value=localStorage.getItem('calendar_backend_key')||'';calendarDialog.showModal()};
$('cancelCalendar').onclick=()=>calendarDialog.close();
$('saveCalendar').onclick=()=>{const u=$('backendUrlInput').value.trim(),k=$('backendKeyInput').value.trim();if(!u||!k)return;localStorage.setItem('calendar_backend_url',u);localStorage.setItem('calendar_backend_key',k);calendarDialog.close();loadCalendar()};
$('clearCalendar').onclick=()=>{localStorage.removeItem('calendar_backend_url');localStorage.removeItem('calendar_backend_key');localStorage.removeItem('calendar_events_cache');todayEvents=[];tomorrowEvents=[];renderEvents();$('calendarStatus').textContent='Calendar 設定已清除。';calendarDialog.close()};
$('nightBtn').onclick=()=>{const n=!document.body.classList.contains('night');document.body.classList.toggle('night',n);localStorage.setItem('manualNight',n?'1':'0')};
$('nightBtn').ondblclick=()=>{localStorage.removeItem('manualNight');tick()};
document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>launchApp(b.dataset.scheme));
renderTasks();loadCachedEvents();renderEvents();tick();weather();if(localStorage.getItem('calendar_backend_url')&&localStorage.getItem('calendar_backend_key'))setTimeout(loadCalendar,500);setInterval(tick,1000);setInterval(weather,600000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&localStorage.getItem('calendar_backend_url'))loadCalendar()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=15',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script>
</body>
</html>
