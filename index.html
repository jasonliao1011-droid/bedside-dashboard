<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Bedside Dashboard</title><style>:root{--b:#0f1115;--p:#171a21;--p2:#1d2129;--t:#f5f7fa;--m:#aab2bf;--bd:#2a303a}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}body{overflow:hidden;transition:filter .3s}body.night{filter:brightness(.5)}.app{width:100vw;height:100vh;padding:24px;display:grid;grid-template-columns:1.45fr 1fr;grid-template-rows:auto 1fr auto;gap:18px}.top{grid-column:1/3;display:flex;justify-content:space-between;align-items:flex-start}.time{font-size:78px;line-height:.92;font-weight:750;letter-spacing:-4px}.date{margin-top:10px;color:var(--m);font-size:22px}.rt{display:flex;gap:14px;align-items:flex-start}.weather{text-align:right}.temp{font-size:42px;font-weight:650}.desc{color:var(--m);font-size:18px;margin-top:4px}.ib,.sb{border:1px solid var(--bd);background:#222731;color:var(--t);border-radius:14px}.ib{width:48px;height:48px;font-size:22px}.sb{padding:8px 12px;font-size:14px}.card{background:linear-gradient(180deg,var(--p),var(--p2));border:1px solid var(--bd);border-radius:24px;padding:22px;overflow:auto;min-height:0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h2{margin:0;font-size:22px}.event,.task{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--bd)}.event:last-child,.task:last-child{border-bottom:0}.et{width:70px;color:var(--m);font-variant-numeric:tabular-nums}.title,.taskText{font-size:19px}.meta{font-size:14px;color:var(--m);margin-top:4px}.task{justify-content:space-between}.taskLeft{display:flex;gap:12px;align-items:flex-start}.task input{width:22px;height:22px;margin-top:1px}.done .taskText{text-decoration:line-through;color:var(--m)}.del{border:0;background:transparent;color:var(--m);font-size:20px}.bottom{grid-column:1/3;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick{text-decoration:none;color:var(--t);background:var(--p);border:1px solid var(--bd);border-radius:18px;padding:16px 12px;text-align:center;font-weight:600}.empty,.notice{color:var(--m);font-size:14px}.empty{padding:10px 0}.notice{margin-top:10px}dialog{border:1px solid var(--bd);border-radius:20px;background:var(--p);color:var(--t);width:min(520px,88vw);padding:20px}dialog::backdrop{background:#0008}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field input{border:1px solid var(--bd);background:#0f1115;color:var(--t);border-radius:12px;padding:12px;font-size:16px}.row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr auto;overflow:auto}.top,.bottom{grid-column:1}.time{font-size:58px}body{overflow:auto}}</style></head><body><div class="app"><header class="top"><div><div class="time" id="time">--:--</div><div class="date" id="date">--</div></div><div class="rt"><div class="weather"><div class="temp" id="temp">--°</div><div class="desc" id="weatherDesc">載入天氣中…</div></div><button class="ib" id="nightBtn">☾</button></div></header><section class="card"><div class="head"><h2>今日行程</h2><button class="sb" id="calendarBtn">Google Calendar</button></div><div id="events"></div><div class="notice" id="calendarStatus">Google Calendar 尚未連接。</div></section><section class="card"><div class="head"><h2>今日待辦</h2><button class="sb" id="addTaskBtn">＋ 新增</button></div><div id="tasks"></div></section><nav class="bottom"><a class="quick" href="https://chatgpt.com" target="_blank">ChatGPT</a><a class="quick" href="https://www.youtube.com" target="_blank">YouTube</a><a class="quick" href="https://open.spotify.com" target="_blank">Spotify</a><a class="quick" href="https://calendar.google.com" target="_blank">Calendar</a></nav></div><dialog id="taskDialog"><h2>新增待辦</h2><div class="field"><label>內容</label><input id="taskInput" placeholder="例如：完成今天的計組進度"></div><div class="row"><button class="sb" id="cancelTask">取消</button><button class="sb" id="saveTask">新增</button></div></dialog><dialog id="calendarDialog"><h2>Google Calendar</h2><p style="color:var(--m);line-height:1.6">網站部署完成後，下一步設定 Google OAuth Client ID，就能把你的今日行程顯示在這裡。</p><div class="row"><button class="sb" onclick="calendarDialog.close()">知道了</button></div></dialog><script>const $=x=>document.getElementById(x);let tasks=JSON.parse(localStorage.getItem('bedside_tasks')||'null')||[{text:'完成今天的考研進度',done:false},{text:'整理家教教材',done:false},{text:'確認明天行程',done:false}],events=[];function save(){localStorage.setItem('bedside_tasks',JSON.stringify(tasks))}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function renderTasks(){$('tasks').innerHTML=tasks.length?tasks.map((t,i)=>`<div class="task ${t.done?'done':''}"><label class="taskLeft"><input type="checkbox" data-i="${i}" ${t.done?'checked':''}><span class="taskText">${esc(t.text)}</span></label><button class="del" data-d="${i}">×</button></div>`).join(''):'<div class="empty">今天沒有待辦</div>';document.querySelectorAll('[data-i]').forEach(x=>x.onchange=()=>{tasks[+x.dataset.i].done=x.checked;save();renderTasks()});document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{tasks.splice(+x.dataset.d,1);save();renderTasks()})}function renderEvents(){$('events').innerHTML=events.length?events.map(e=>`<div class="event"><div class="et">${e.time}</div><div><div class="title">${esc(e.title)}</div><div class="meta">${esc(e.meta||'')}</div></div></div>`).join(''):'<div class="empty">今天沒有載入行程</div>'}function tick(){const d=new Date();$('time').textContent=d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});$('date').textContent=d.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});if(localStorage.getItem('manualNight')===null){const h=d.getHours();document.body.classList.toggle('night',h>=23||h<7)}}async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=25.033&longitude=121.5654&current=temperature_2m,weather_code&timezone=Asia%2FTaipei'),j=await r.json(),c=j.current.weather_code,ds=c===0?'晴朗':c<=3?'多雲':c<=48?'有霧':c<=67?'有雨':c<=77?'降雪':c<=82?'陣雨':'雷雨';$('temp').textContent=Math.round(j.current.temperature_2m)+'°';$('weatherDesc').textContent='台北 · '+ds}catch{$('weatherDesc').textContent='天氣讀取失敗'}}$('addTaskBtn').onclick=()=>{taskInput.value='';taskDialog.showModal()};$('cancelTask').onclick=()=>taskDialog.close();$('saveTask').onclick=()=>{const t=taskInput.value.trim();if(t){tasks.push({text:t,done:false});save();renderTasks();taskDialog.close()}};$('calendarBtn').onclick=()=>calendarDialog.showModal();$('nightBtn').onclick=()=>{const n=!document.body.classList.contains('night');document.body.classList.toggle('night',n);localStorage.setItem('manualNight',n?'1':'0')};$('nightBtn').ondblclick=()=>{localStorage.removeItem('manualNight');tick()};renderTasks();renderEvents();tick();weather();setInterval(tick,1000);setInterval(weather,600000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
