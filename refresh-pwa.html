<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><title>更新 Bedside Dashboard</title><style>html,body{margin:0;height:100%;background:#0f1115;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}.wrap{height:100%;display:grid;place-items:center;padding:24px}.card{max-width:560px;width:100%;background:#171a21;border:1px solid #2a303a;border-radius:24px;padding:28px;box-sizing:border-box}.title{font-size:28px;font-weight:700;margin-bottom:12px}.msg{color:#aab2bf;line-height:1.65;font-size:17px}.ok{color:#d8f7df}.err{color:#ffb4b4}</style></head><body><div class="wrap"><div class="card"><div class="title">正在更新 Dashboard</div><div class="msg" id="msg">正在清除舊版 PWA 快取，待辦與 Calendar 設定會保留。</div></div></div><script>(async()=>{const m=document.getElementById('msg');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}m.className='msg ok';m.textContent='更新完成，正在重新載入最新版…';setTimeout(()=>location.replace('./?fresh='+Date.now()),700)}catch(e){m.className='msg err';m.textContent='自動更新失敗。請關閉 Dashboard 後再重新開啟 Safari 重試。'} })();</script></body></html>
