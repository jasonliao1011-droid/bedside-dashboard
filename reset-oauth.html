<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1115"><title>Reset Google OAuth</title><style>html,body{margin:0;height:100%;background:#0f1115;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{height:100%;display:grid;place-items:center;padding:24px}.card{max-width:560px;background:#171a21;border:1px solid #2a303a;border-radius:20px;padding:24px}.muted{color:#aab2bf;line-height:1.6}.ok{color:#d8f5df}.btn{display:inline-block;margin-top:12px;padding:12px 16px;border-radius:12px;background:#222731;color:#f5f7fa;text-decoration:none;border:1px solid #2a303a;font-size:16px}</style></head><body><div class="wrap"><div class="card"><h2>重新設定 Google OAuth</h2><p class="muted" id="status">正在清除舊的 Client ID 與 Dashboard 快取…</p><button class="btn" id="go" disabled>回到 Dashboard 並重新輸入</button></div></div><script>(async()=>{try{localStorage.removeItem('google_client_id');sessionStorage.clear();if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}document.getElementById('status').innerHTML='<span class="ok">已完成重設。</span><br>你的待辦資料會保留；只有 Google OAuth Client ID、工作階段與網站快取被清除。';const b=document.getElementById('go');b.disabled=false;b.onclick=()=>{location.href='./?oauth-reset='+Date.now()}}catch(e){document.getElementById('status').textContent='重設時發生錯誤：'+e.message}}</script></body></html>
